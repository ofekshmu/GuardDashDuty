<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentinel — Guard Duty Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- Mobile Top Bar -->
    <header id="mobile-header">
      <button id="hamburger" class="hamburger" aria-label="Open navigation">
        <span></span><span></span><span></span>
      </button>
      <div class="mobile-brand">
        <i class="fa-solid fa-shield-halved"></i>
        <span>Sentinel</span>
      </div>
      <div id="mobile-coins" class="mobile-coins"></div>
    </header>

    <!-- Nav Backdrop (mobile) -->
    <div id="nav-backdrop" class="nav-backdrop"></div>

    <!-- Sidebar Navigation -->
    <nav id="main-nav">
      <div class="nav-header">
        <div class="nav-brand">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Sentinel</span>
        </div>
        <button id="nav-close" class="icon-btn" aria-label="Close menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="nav-user-section" id="nav-user-section"></div>

      <ul class="nav-links" id="nav-links">
        <li><a href="#home"         class="nav-item" data-page="home">        <i class="fa-solid fa-house"></i>           <span>Home</span></a></li>
        <li><a href="#about"        class="nav-item" data-page="about">       <i class="fa-solid fa-circle-info"></i>     <span>About</span></a></li>
        <li><a href="#calendar"     class="nav-item" data-page="calendar">    <i class="fa-solid fa-calendar-days"></i>   <span>Calendar</span></a></li>
        <li id="nav-li-duty-manager">
          <a href="#duty-manager" class="nav-item" data-page="duty-manager">  <i class="fa-solid fa-sliders"></i>         <span>Duty Manager</span><em class="nav-tag">MGR</em></a>
        </li>
        <li><a href="#users"        class="nav-item" data-page="users">       <i class="fa-solid fa-users"></i>           <span>Personnel</span></a></li>
        <li><a href="#requests"     class="nav-item" data-page="requests">    <i class="fa-solid fa-inbox"></i>           <span>Requests</span>    <span class="nav-badge" id="requests-badge" style="display:none">0</span></a></li>
        <li><a href="#market"       class="nav-item" data-page="market">      <i class="fa-solid fa-store"></i>           <span>Duty Market</span></a></li>
      </ul>

      <div class="nav-footer">
        <button id="logout-btn" class="btn btn-ghost nav-logout">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="page-content">
      <div class="page-loader">
        <i class="fa-solid fa-shield-halved fa-spin"></i>
        <p>Loading Sentinel…</p>
      </div>
    </main>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-overlay"></div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- CDN: jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- App Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
